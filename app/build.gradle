plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'

}

android {
    namespace 'com.vshum.turbogum'
    compileSdk 36

    defaultConfig {
        applicationId "com.vshum.turbogum"
        minSdk 23
        targetSdk 35
        versionCode 35
        versionName "16.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/rxjava.properties']
        }
    }


    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}



dependencies {

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    //библиотека com.google.firebase: подключается автоматически при синхронизации с firebase
    implementation 'com.google.firebase:firebase-database-ktx:21.0.0'
    implementation 'com.google.firebase:firebase-firestore-ktx:25.1.4'
    implementation 'com.google.firebase:firebase-auth-ktx:23.2.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'


    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Retrofit && Gson lib
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:3.0.0'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'

    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.squareup.picasso:picasso:2.71828'

    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'
    kapt 'com.github.bumptech.glide:compiler:5.0.7'


    //room

    implementation "androidx.room:room-runtime:2.8.4"
    kapt "androidx.room:room-compiler:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"


    //coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    //Additionally, you might need to include the following dependencies if you want to use the Room database with LiveData and ViewModel.
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"


    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"

    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    //Обычно она уже подключена в новых проектах на Kotlin, но если у вас возникают проблемы с ее использованием
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.0"


    // Import the Firebase BoM
    implementation 'com.google.firebase:firebase-bom:34.12.0'
    implementation 'com.google.firebase:firebase-analytics-ktx:22.5.0'

    //	Play Integrity API Terms of Service без этой библиотеки н
    implementation 'com.google.android.play:integrity:1.6.0'
    implementation 'com.google.android.gms:play-services-safetynet:18.1.0'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.0"

    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    // In-App Update API
    implementation 'com.google.android.play:app-update:2.1.0'
}